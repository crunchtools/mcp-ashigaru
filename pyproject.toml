# Tool configuration only. Ashigaru ships workflows and scripts, not a package;
# the scripts use the standard library and the `gh` CLI the runner provides.

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
