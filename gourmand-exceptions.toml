# Gourmand exceptions.
#
# Every entry needs a justification that says WHY the finding is wrong or why
# the code is right anyway. "Baseline: N violations - review and fix" is not a
# justification — the whole file used to read that way, and every one of those
# entries has now either been fixed or replaced below.

[[exceptions]]
check = "summary_litter"
path = "CLAUDE.md"
justification = "Required by the CrunchTools constitution as the project's agent instructions; it is not a status report."

[[exceptions]]
check = "verbose_comments"
path = "src/mcp_ashigaru/prompts.py"
justification = "Gourmand bug: this file is nothing but markdown workflow playbooks returned from @mcp.prompt(). Its Python scanner treats a `#` heading inside a triple-quoted string as a comment, so every `## Step N` in the playbook text counts as a violation. The playbooks were moved out of server.py into this file specifically so the miscount is confined here instead of masking real comment slop in the server."

[[exceptions]]
check = "lint_suppression"
path = "src/mcp_ashigaru/notify.py"
justification = "Two `# noqa: S310` on urllib Request/urlopen. S310 asks for the URL scheme to be checked, and _send_webhook checks it two lines earlier, raising ValueError on anything but http(s). The suppression records that the audit was done, which is the correct use of noqa."

[[exceptions]]
check = "single_use_helpers"
path = "cockpit-ashigaru/ashigaru.js"
justification = "A Cockpit single-page app. renderListPage, renderDetailPage, renderDetailContent, startAutoRefresh and init are dispatched from the router and the page lifecycle, so each has exactly one textual call site by construction. Merging them would produce one unreadable render function."

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_ashigaru/runner.py"
justification = "_infer_sub_phase is a six-line pure lookup from ActivityKind to Phase. Its only caller, _process_event, is already four levels deep inside a loop; inlining would deepen it further for no gain."
