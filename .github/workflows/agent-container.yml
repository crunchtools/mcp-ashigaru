name: Agent Container Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile.agent'
      - '.github/workflows/agent-container.yml'
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - 'Containerfile.agent'
      - '.github/workflows/agent-container.yml'
  schedule:
    - cron: '0 6 * * 1'   # Weekly Monday 06:00 UTC — pick up new Claude Code releases
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/mcp-ashigaru-agent-claude
  GHCR_IMAGE: ghcr.io/crunchtools/mcp-ashigaru-agent-claude

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest Claude Code version
        id: claude_version
        run: |
          VERSION=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo "latest")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Claude Code version: $VERSION"

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.QUAY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=claude-${{ steps.claude_version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDE_VERSION=${{ steps.claude_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest Claude Code version
        id: claude_version
        run: |
          VERSION=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo "latest")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=claude-${{ steps.claude_version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDE_VERSION=${{ steps.claude_version.outputs.version }}
          cache-from: type=gha
