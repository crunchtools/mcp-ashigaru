name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check src

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest tests/ -v

  gourmand:
    name: Code Quality (Gourmand)
    runs-on: ubuntu-latest
    container:
      image: quay.io/crunchtools/gourmand:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gourmand
        run: gourmand --full .

  gatehouse:
    name: Code Review (Gatehouse)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Gatehouse
        run: uv tool install gatehouse

      - name: Run Gatehouse code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gatehouse --base ${{ github.event.pull_request.base.sha }}
